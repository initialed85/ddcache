worker_processes auto;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  log_format cache '$request cache=$upstream_cache_status sent=$body_bytes_sent request=$request_time upstream=$upstream_response_time';

  access_log  /var/log/nginx/access.log  cache;

  sendfile on;
  tcp_nopush on;

  resolver 1.1.1.1 valid=300s ipv6=off;
  resolver_timeout 10s;

  proxy_http_version 1.1;
  proxy_set_header Connection "";

  proxy_cache_path /var/cache/apt-cache/nginx levels=1:2 keys_zone=apt:100m max_size=80g inactive=365d use_temp_path=off;

  map $request $not_proxy_request {
    "~^[A-Z]+ http://" 0;
    default 1;
  }

  map $host $not_apt_host {
    hostnames;
    default 1;
    .archive.ubuntu.com 0;
    security.ubuntu.com 0;
    ports.ubuntu.com 0;
    mirror.hetzner.com 0;
    mirror.aarnet.edu.au 0;
    deb.debian.org 0;
    security.debian.org 0;
    archive.debian.org 0;
    snapshot.debian.org 0;
    apt.postgresql.org 0;
    apt-archive.postgresql.org 0;
  }

  map $host $metrics_upstream_host {
    hostnames;
    default other;
    .archive.ubuntu.com $host;
    security.ubuntu.com $host;
    ports.ubuntu.com $host;
    mirror.hetzner.com $host;
    mirror.aarnet.edu.au $host;
    deb.debian.org $host;
    security.debian.org $host;
    archive.debian.org $host;
    snapshot.debian.org $host;
    apt.postgresql.org $host;
    apt-archive.postgresql.org $host;
  }

  map "$not_apt_host$request_method" $skip_cache {
    "0GET" 0;
    default 1;
  }

  server {
    listen 3142;

    allow 0.0.0.0/0;
    deny all;

    if ($not_proxy_request) {
      return 400 "apt-cache is an HTTP proxy: use it as http_proxy or Acquire::http::Proxy\n";
    }

    location ~ "^/archive/[^/]+/[0-9]{8}T[0-9]{6}Z/" {
      proxy_pass http://$host$request_uri;

      proxy_cache apt;
      proxy_cache_key $host$uri;
      proxy_cache_valid 200 301 302 365d;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_cache_bypass $skip_cache;
      proxy_no_cache $skip_cache;
      proxy_cache_use_stale error timeout updating http_404 http_500 http_502 http_503 http_504;
      proxy_cache_lock on;

      add_header X-Cache $upstream_cache_status always;
    }

    location ~ "/(pool|by-hash)/|^/file/[0-9a-f]{40}(/|$)" {
      proxy_pass http://$host$request_uri;

      proxy_cache apt;
      proxy_cache_key $host$uri;
      proxy_cache_valid 200 365d;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_cache_bypass $skip_cache;
      proxy_no_cache $skip_cache;
      # once we hold a file, upstream deleting it (404) doesn't take it away from us
      proxy_cache_use_stale error timeout updating http_404 http_500 http_502 http_503 http_504;

      # one download per file: the rest wait for it rather than starting their own
      proxy_cache_lock on;
      proxy_cache_lock_timeout 15m;
      proxy_cache_lock_age 15m;

      # fetch whole files, so what's cached is complete; ranges (apt resuming) come from the copy
      proxy_set_header Range "";
      proxy_set_header If-Range "";
      proxy_force_ranges on;

      add_header X-Cache $upstream_cache_status always;
    }

    location ~ /dists/[^/]+/(InRelease|Release|Release\.gpg)$ {
      proxy_pass http://$host$request_uri;

      proxy_cache apt;
      proxy_cache_key $host$uri;
      proxy_cache_valid 200 60m;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_cache_bypass $skip_cache;
      proxy_no_cache $skip_cache;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;

      add_header X-Cache $upstream_cache_status always;
    }

    location / {
      proxy_pass http://$http_host$request_uri;
      proxy_buffering off;
    }
  }
}
